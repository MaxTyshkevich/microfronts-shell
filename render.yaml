services:
  - type: web
    name: microfronts-shell
    runtime: static
    buildCommand: npm ci --include=dev && npm run typecheck && npm run build
    staticPublishPath: ./dist
    # Configure the deployment-specific /api reverse proxy before this fallback.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_CATALOG_REMOTE_URL
        sync: false
      - key: VITE_CART_REMOTE_URL
        sync: false
    headers:
      - path: /remoteEntry.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Access-Control-Allow-Origin
        value: '*'
